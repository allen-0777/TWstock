<!DOCTYPE html>
<html lang="zh-TW" class="no-js">
<head>
	<meta charset="UTF-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{% block title %}大戶的貓膩{% endblock %}</title>
	<link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.10.22/css/jquery.dataTables.css">
	<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/normalize.css') }}" />
	<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/demo.css') }}" />
	<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/icons.css') }}" />
	<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/component.css') }}" />
</head>
<body>
	<!-- 頁面載入遮罩 -->
	<div class="page-loading" id="pageLoader">
		<div class="spinner"></div>
		<span class="spinner-text">資料載入中…</span>
	</div>

	<div id="st-container" class="st-container">
		<nav class="st-menu st-effect-9" id="menu-9">
			<h2 class="icon icon-cat">
				<a href="/" class="site-title">大戶的貓膩</a>
			</h2>
			<ul>
				<li><a class="icon icon-study {% if request.path == '/' %}nav-active{% endif %}" href="/">每日盤後</a></li>
				<li><a class="icon icon-study {% if request.path == '/for_ib_common' %}nav-active{% endif %}" href="/for_ib_common">外資投信同買</a></li>
				<li><a class="icon icon-study {% if request.path == '/for_buy_sell' %}nav-active{% endif %}" href="/for_buy_sell">外資買賣超</a></li>
				<li><a class="icon icon-study {% if request.path == '/ib_buy_sell' %}nav-active{% endif %}" href="/ib_buy_sell">投信買賣超</a></li>
			</ul>
		</nav>

		<div class="st-pusher">
			<div class="st-content">
				<div class="st-content-inner">
					{% block content %}{% endblock %}
				</div>
			</div>
		</div>
	</div>

	<script src="{{ url_for('static', filename='js/modernizr.custom.js') }}"></script>
	<script src="{{ url_for('static', filename='js/classie.js') }}"></script>
	<script src="{{ url_for('static', filename='js/sidebarEffects.js') }}"></script>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script type="text/javascript" charset="utf8"
		src="https://cdn.datatables.net/1.10.22/js/jquery.dataTables.js"></script>

	<script>
		/* 隱藏載入遮罩 */
		function hideLoader() {
			var loader = document.getElementById('pageLoader');
			if (!loader) return;
			loader.classList.add('fade-out');
			setTimeout(function () { loader.style.display = 'none'; }, 370);
		}
		/* 安全備援：最多等 6 秒 */
		setTimeout(hideLoader, 6000);

		/* 財務數字顏色渲染（台股慣例：紅漲綠跌） */
		function numRender(data, type) {
			if (type !== 'display') return data;
			var n = parseFloat(String(data).replace(/,/g, ''));
			if (isNaN(n)) return data;
			var cls = n > 0 ? 'num-up' : (n < 0 ? 'num-down' : 'num-flat');
			return '<span class="' + cls + '">' + data + '</span>';
		}

		/* ESC 鍵關閉側邊欄 */
		document.addEventListener('keydown', function (e) {
			if (e.key === 'Escape') {
				var pusher = document.querySelector('.st-pusher');
				if (pusher) pusher.click();
			}
		});
	</script>

	{% block scripts %}{% endblock %}
</body>
</html>
