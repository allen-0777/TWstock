{% extends "base.html" %}
{% block title %}外資投信同買 — 大戶的貓膩{% endblock %}

{% block content %}
<div id="st-trigger-effects" class="column">
	<button data-effect="st-effect-9">貓貓側邊欄</button>
	<div class="card-body">
		<div class="table-responsive">
			{% if data_date %}<span class="data-date">📅 {{ data_date }}</span>{% endif %}
			<table class="table table-bordered" id="datatable" width="100%" cellspacing="0">
				<caption>外資投信同買</caption>
				<thead>
					<tr>
						<th>證券代號</th>
						<th>證券名稱</th>
						<th>外資買賣超股數</th>
						<th>投信買賣超股數</th>
					</tr>
				</thead>
				<tbody></tbody>
			</table>
		</div>
	</div>
</div>
{% endblock %}

{% block scripts %}
<script>
	$(document).ready(function () {
		var jsonData = {{ common_table | tojson | safe }};
		$('#datatable').DataTable({
			data: JSON.parse(jsonData),
			columns: [
				{ data: '證券代號' },
				{ data: '證券名稱' },
				{ data: '外資買賣超股數', render: numRender },
				{ data: '投信買賣超股數', render: numRender }
			],
			order: [[3, 'desc']],
			pageLength: 50
		});

		hideLoader();
	});
</script>
{% endblock %}
